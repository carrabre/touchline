name: TouchlineUploader
options:
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    PRODUCT_BUNDLE_IDENTIFIER: com.carrabre.touchline.uploader
    MARKETING_VERSION: '1.0'
    CURRENT_PROJECT_VERSION: '1'
targets:
  TouchlineUploader:
    type: application
    platform: iOS
    sources: [TouchlineUploader]
    info:
      path: TouchlineUploader/Info.plist
      properties:
        CFBundleDisplayName: Touchline
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        LSSupportsOpeningDocumentsInPlace: true
    settings:
      base:
        TARGETED_DEVICE_FAMILY: '1,2'
        CODE_SIGN_STYLE: Automatic
schemes:
  TouchlineUploader:
    build:
      targets:
        TouchlineUploader: all
